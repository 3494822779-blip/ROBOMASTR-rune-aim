# Bevy TCP camera + virtual gimbal. Intrinsics and pose come from each frame.
input:
  mode: simulator
  source: 192.168.31.157:7447
  max_frames: 0
  video_fps: 30
fire:
  bullet_speed: 25.0
  shoot_delay: 0.0
  algorithmic_delay: 0.08
