# =============================================================
# config/template.yaml —— 全部参数完整模板（带注释）
# 复制为 rune_*.yaml 后按需修改；未写的字段用代码内默认值。
# 所有参数的含义见 docs/CONFIG_REFERENCE.md。
# =============================================================

input:                    # —— 数据源 ——
  mode: virtual           # video | fixed_video | virtual | camera
  source: data/rune_test_h264.mp4   # video: 视频路径；camera: 设备索引 "0"
  max_frames: 0           # 0 = 不限帧
  hz: 200                 # virtual 模式仿真帧率 Hz
  video_fps: 0            # video PTS 无效时的兜底帧率（0 = 30）

camera:                   # —— 相机标定（virtual 模式可用演示内参）——
  matrix: [1400, 0, 720, 0, 1400, 540, 0, 0, 1]   # 内参 3×3 行优先（fx 0 cx 0 fy cy 0 0 1）
  distortion: [0, 0, 0, 0, 0]                     # 畸变 k1 k2 p1 p2 k3
  transform: [0, 0, 0, 1, 0, 0, 0]                # 相机→Odom 外参：t(x,y,z) + q(x,y,z,w)
  image_width: 1440       # 画幅宽（须与 cx 对应）；virtual 模式据此裁掉画幅外的观测
  image_height: 1080      # 画幅高（须与 cy 对应）

detect:                   # —— 检测（RuneDetector）——
  engine: model/Rune-v8n-fp16-20260624_b1_gpu0_fp16.engine   # Tens#orRT 引擎路径
  score_threshold: 0.8    # 类别置信度阈值（调低召回↑误检↑）
  keypoint_threshold: 0.8 # 关键点置信度阈值
  center_distance: 30.0   # NMS 关键点中心距离 px
  refine_radius: 10       # 符叶端点细化搜索半径 px
  icon_refine_radius: 14  # R 标细化搜索半径 px
  max_refine_shift: 7.0   # 细化最大位移 px（超限回退网络点）
  min_refine_gradient: 12.0  # 细化最小梯度响应
  min_refine_support: 6   # 细化最小支撑点数

track:                    # —— EKF 跟踪（RuneModel）——
  noise_x: 1e-5           # 位置过程噪声（符心 x）
  noise_y: 1e-5           # 位置过程噪声（符心 y）
  noise_z: 1e-5           # 位置过程噪声（符心 z）
  noise_rotation_angle: 1e-3   # 转角过程噪声
  noise_rotation_speed: 1e-0   # 角速度过程噪声
  noise_face_yaw: 1e-5    # 符面朝向过程噪声
  noise_observation: 20.0 # 观测噪声 px²（虚拟模式可收紧到 2；真机按检测抖动调）
  gate_threshold: 13.816  # 观测关联门限（马氏距离²，6 自由度 99%）
  init_seed_mean_error: 10.0  # 初始化重投影 RMS 误差上限 px
  init_seed_max_error: 20.0   # 初始化重投影最大误差上限 px
  init_center_gate: 30.0      # 初始化符叶中心匹配门限 px#
  init_pitch_bound: 20.0      # 初始化符面俯仰角上限 degree
  diverge_face_angle: 45.0    # 发散判定：符面朝向与视线夹角 degree
  diverge_cov_max: 150.0      # 协方差发散阈值
  diverge_pos_xy_max: 15.0    # 位置 xy 发散上限 m
  diverge_pos_z_max: 5.0      # 位置 z 发散上限 m
  diverge_speed_factor: 10.0  # 角速度发散上限倍数（× π rad/s）

fire:                     # —— 火控（RuneFireControl）——
  bullet_speed: 22.5      # ★ 弹速 m/s（发射仓标定，最影响预瞄量）
  shoot_delay: 0.04       # ★ 扳机→出膛延迟 s（标定）
  algorithmic_delay: 0.05 # 算法链路延迟 s（delay_calib 标定）
  max_fly_time: 1.0       # 飞行时间上限 s
  pitch_max: 0.61         # 云台俯仰上限 rad ≈ 35°
  fire_cooldown_init: 0.3 # 新目标/切叶后初始冷却 s
  fire_cooldown: 0.7      # 连发窗口后冷却 s
  fire_window: 0.04       # 连续开火窗口 s
  data_life: 0.2          # 数据寿命 s，超时禁射
  recover_time: 0.2       # 数据过期回符心平滑时长 s
  switch_angle: 0.30      # 切叶检测相位跳变阈值 rad ≈ 17°
  switch_confirm: 5       # 连续跳变帧数确认切叶
  offset_yaw: 0.0         # 弹道偏置 rad（往左增）
  offset_pitch: 0.0       # 弹道偏置 rad（往下增）
  max_iterate: 5          # 弹道固定点迭代次数
  iterate_epsilon: 0.001  # 飞行时间收敛判据 s

virtual_rune:             # —— 虚拟符（virtual 模式）——
  large: false            # true=大符（正弦）/ false=小符（恒速）
  x: 6.670                # 符心位置（Odom 系）
  y: 0.0
  z: 2.172
  face_yaw: 0.0           # 符面朝向
  pixel_noise_px: 0.0     # 关键点高斯噪声 σ px（退化模拟）
  dropout_prob: 0.0       # 每片符叶漏检概率 0~1（退化模拟）
  gimbal:                 # —— 云台运动仿真（无真机时验证"外参随云台变化"这条链路）——
    enable: false         # true = 相机外参随时间摆动，而非固定在 camera.transform
    yaw_amp: 10.0         # yaw 摆幅 deg（绕 Odom +z）
    yaw_freq: 0.30        # yaw 频率 Hz
    pitch_amp: 3.0        # pitch 摆幅 deg（绕 Odom +y）
    pitch_freq: 0.17      # pitch 频率 Hz
    transform_delay: 0.0  # 喂给 EKF 的外参滞后 s（模拟 IMU 回读延迟）
    transform_noise: 0.0  # 喂给 EKF 的外参姿态噪声 σ deg（模拟标定/量测误差）
    seed: 7               # 噪声随机种子

diag:                     # —— 预测误差诊断（RuneDiagnostics）——
  match_tolerance_ms: 1.0 # 预测/实测配对容差 ms
  max_queue: 1000         # 预测记录缓冲上限
  max_history: 10000      # 配对样本历史上限

display:                  # —— 可视化调试开关 ——
  enabled: true           # false = 纯终端运行（无人值守/性能测试）
  keypoints: true         # 画检测关键点/符叶/R 标
  aimpoint: false          # 画命中时刻预瞄点
  hitpoint: false          # 开火窗口开始后，在预计命中时刻对应的视频帧画解算落点
  state_text: false        # 画火控状态文字
  error_text: false        # 画诊断误差文字
